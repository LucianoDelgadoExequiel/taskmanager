<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta | Task Manager</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/greenery.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <a class="brand" href="/login">Task<span>Manager</span></a>
    <p class="eyebrow">EMPIEZA A ORGANIZARTE</p>
    <h1>Crea tu cuenta</h1>
    <p class="muted">Regístrate para gestionar tus proyectos y tareas.</p>
    <form id="registerForm" class="form-stack">
        <label for="username">Usuario</label>
        <input id="username" name="username" autocomplete="username" required maxlength="80" placeholder="Tu nombre de usuario">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="tu@correo.com">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="Al menos 8 caracteres">
        <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
        <button class="button button-primary" type="submit">Crear cuenta</button>
    </form>
    <p class="auth-switch">¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></p>
</main>
<script th:src="@{/css/js/login.js}" defer></script>
</body>
</html>
